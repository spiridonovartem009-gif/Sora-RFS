<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413">
<title>One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* тема выставляется до первой отрисовки: auto берёт системную */
(function () {
  var p = 'auto';
  try { p = localStorage.getItem('one-theme') || 'auto'; } catch (e) {}
  var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? '#141413' : '#FCFAF6';
})();
</script>
<script src="config.js"></script>
<style>
:root { --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141413; --s1: #222220; --s2: #2c2c2a; --line: rgba(255, 255, 255, .11);
  --red: #FF4048; --red2: #E0666D; --onred: #190406; --blue: #5DA9FF; --blueS: rgba(93, 169, 255, .16);
  --btn: #F4F2EE; --btnInk: #141413; --warn: #FFB454; --overlay: rgba(0, 0, 0, .6);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #FCFAF6; --s1: #F1EDE6; --s2: #E7E2D9; --line: rgba(40, 30, 20, .13);
  --red: #D4141F; --red2: #A8323A; --onred: #FFFFFF; --blue: #1769C7; --blueS: rgba(23, 105, 199, .12);
  --btn: #1B1B1A; --btnInk: #FCFAF6; --warn: #8F5200; --overlay: rgba(40, 30, 20, .4);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--red); font-family: var(--font); font-size: 16px; line-height: 1.55; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* вход */
.auth { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; overflow-y: auto; background: var(--bg); }
.acard { width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; }
.alogo { width: 190px; max-width: 70%; height: auto; margin: 0 auto 8px; display: block; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 999px; background: var(--s1); }
.seg button { padding: 8px 10px; border-radius: 999px; color: var(--red2); font-weight: 500; font-size: 14.5px; }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--bg); color: var(--red); box-shadow: 0 0 0 1px var(--line); }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--red2); }
.field input { width: 100%; padding: 13px 15px; border-radius: 14px; border: 1px solid var(--line); background: var(--s1); color: var(--red); font-size: 16px; outline: none; }
.field input:focus { border-color: var(--red); }
.field input::placeholder { color: var(--red2); opacity: .6; }
.pw { position: relative; }
.pw input { padding-right: 84px; }
.pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 7px 10px; font-size: 12.5px; color: var(--red2); border-radius: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 999px; background: var(--red); color: var(--onred); font-weight: 600; font-size: 15.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: none; color: var(--red); border: 1px solid var(--line); font-weight: 500; }
.err { min-height: 20px; margin: 0; font-size: 13.5px; color: var(--warn); }
.note { margin: 0; font-size: 12.5px; color: var(--red2); text-align: center; }

/* каркас */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
header { flex: none; display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top) + 8px) 10px 8px; }
.ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--red); }
.ib:hover { background: var(--s1); }
.mchip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 14px; border-radius: 999px; font-weight: 600; font-size: 17px; color: var(--red); }
.mchip:hover { background: var(--s1); }
.mchip svg { opacity: .8; }
#msgs { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: auto; }
.col { width: min(760px, 100%); margin: 0 auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 22px; min-height: 100%; }
.empty { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 0; text-align: center; }
.empty img { width: 76px; height: auto; }
.empty p { margin: 0; font-size: 22px; font-weight: 600; color: var(--red); }
.empty small { font-size: 13.5px; color: var(--red2); }

.msg.user { align-self: flex-end; max-width: 86%; padding: 10px 16px; border-radius: 22px 22px 6px 22px; background: var(--s1); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { align-self: stretch; overflow-wrap: anywhere; }
.msg.bot .body > :first-child { margin-top: 0; }
.msg.bot .body > :last-child { margin-bottom: 0; }
.msg.bot.typing .body:empty::after, .msg.bot.typing .body > :last-child::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: var(--red); vertical-align: middle; animation: pulse 1s ease-in-out infinite; }
.msg.bot.typing .body > pre::after, .msg.bot.typing .body > .code::after { display: none; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
.msg.bot.fail .body { color: var(--warn); }
.acts { display: flex; gap: 2px; margin-top: 6px; margin-left: -8px; }
.acts button { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--red2); }
.acts button:hover { background: var(--s1); color: var(--red); }
.sys { align-self: center; max-width: 92%; padding: 10px 16px; border: 1px solid var(--line); border-radius: 16px; font-size: 14px; color: var(--warn); text-align: center; }

.body p { margin: 0 0 .8em; }
.body h2, .body h3, .body h4 { margin: 1.1em 0 .45em; line-height: 1.3; font-weight: 700; }
.body h2 { font-size: 1.25em; } .body h3 { font-size: 1.12em; } .body h4 { font-size: 1em; }
.body ul, .body ol { margin: 0 0 .8em; padding-left: 1.4em; }
.body li { margin: .2em 0; }
.body blockquote { margin: 0 0 .8em; padding: 2px 0 2px 14px; border-left: 3px solid var(--red2); color: var(--red2); }
.body hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.body a { color: var(--red); text-decoration: underline; text-underline-offset: 3px; }
.body code { font-family: var(--mono); font-size: .88em; padding: .12em .4em; border-radius: 6px; background: var(--s1); }
.code { margin: 0 0 .9em; border-radius: 14px; background: var(--s1); overflow: hidden; border: 1px solid var(--line); }
.chead { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px; font-family: var(--mono); font-size: 12px; color: var(--red2); border-bottom: 1px solid var(--line); }
.chead button { padding: 5px 10px; border-radius: 8px; font-size: 12px; color: var(--red2); }
.chead button:hover { background: var(--s2); color: var(--red); }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 13.5px; line-height: 1.5; }
.code pre code { padding: 0; background: none; font-size: inherit; }
.tbl { margin: 0 0 .9em; overflow-x: auto; }
.tbl table { border-collapse: collapse; font-size: .94em; }
.tbl th, .tbl td { padding: 7px 12px; border: 1px solid var(--line); text-align: left; }
.tbl th { background: var(--s1); }

/* ввод */
footer { flex: none; padding: 4px 12px calc(env(safe-area-inset-bottom) + 10px); }
.tok { width: min(760px, 100%); margin: 0 auto 6px; text-align: center; font-size: 12px; color: var(--red2); min-height: 0; }
.tok:empty { display: none; }
.tok.low { color: var(--warn); }
.composer { width: min(760px, 100%); margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; }
.rb { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--s1); color: var(--red); }
.rb:hover { background: var(--s2); }
.rb.send { background: var(--btn); color: var(--btnInk); }
.rb.send:disabled { opacity: .35; cursor: default; }
.pill { flex: 1; min-width: 0; min-height: 48px; border-radius: 26px; background: var(--s1); display: flex; align-items: center; gap: 8px; padding: 0 18px; }
.pill textarea { flex: 1; min-width: 0; width: auto; max-height: 160px; padding: 12px 0; border: 0; outline: none; resize: none; background: none; color: var(--red); font-size: 17px; line-height: 24px; font-weight: 500; display: block; }
.pill textarea::placeholder { color: var(--red2); opacity: .75; font-weight: 500; }

/* плашка-оптимизатор */
.hint { width: min(760px, 100%); margin: 0 auto; display: grid; grid-template-rows: 0fr; opacity: 0; visibility: hidden; transition: grid-template-rows .26s ease, opacity .22s ease, margin .26s ease, visibility 0s .26s; }
.hint.on { grid-template-rows: 1fr; opacity: 1; visibility: visible; margin-bottom: 8px; transition-delay: 0s; }
.hint > div { overflow: hidden; min-height: 0; }
.hint .in { display: flex; align-items: center; gap: 10px; padding: 9px 8px 9px 16px; border-radius: 18px; background: var(--s1); border: 1px solid var(--line); font-size: 14px; line-height: 1.35; color: var(--red); }
.hint .in span { flex: 1; min-width: 0; }
.hint .go { flex: none; padding: 7px 15px; border-radius: 999px; background: var(--red); color: var(--onred); font-weight: 600; font-size: 14px; }
.hint .no { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--red2); }
.hint .no:hover { background: var(--s2); }

/* команды через / */
.cwrap { position: relative; width: min(760px, 100%); margin: 0 auto; }
.cwrap .composer { width: 100%; }
.cmenu { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); max-height: min(52vh, 430px); overflow-y: auto; padding: 6px; border-radius: 20px; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0, 0, 0, .28); z-index: 12; opacity: 0; transform: translateY(8px); visibility: hidden; transition: opacity .18s ease, transform .18s ease, visibility 0s .18s; }
.cmenu.on { opacity: 1; transform: none; visibility: visible; transition-delay: 0s; }
.cgrp { padding: 10px 12px 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--red2); }
.citem { display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; }
.citem b { flex: none; min-width: 86px; color: var(--red); font-family: var(--mono); font-weight: 600; font-size: 15px; }
.citem span { color: var(--red2); font-size: 14px; line-height: 1.3; }
.citem.act, .citem:hover { background: var(--s1); }
.ctag { flex: none; align-self: flex-start; margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px 0 12px; border-radius: 999px; background: var(--red); color: var(--onred); font-family: var(--mono); font-size: 14px; font-weight: 600; animation: pop .16s ease; }
.ctag[hidden] { display: none; }
.ctag svg { opacity: .8; }
.ctag.mini { align-self: auto; margin: 0 8px 0 0; height: 22px; padding: 0 10px; font-size: 12.5px; vertical-align: 1px; animation: none; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

/* озвучка */
.ttsb { flex: none; align-self: flex-end; margin: 0 -10px 6px 0; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--red2); }
.ttsb:hover { background: var(--s2); }
.ttsb[aria-pressed="true"] { color: var(--red); background: var(--s2); }
.ttsb[hidden] { display: none; }
.vrow { display: flex; align-items: center; gap: 14px; }
.vrow .vlogo { flex: none; color: var(--red); }
.vrow .seg { flex: 1; }
.plugin-grid { display:grid; grid-template-columns:1fr; gap:8px; margin-top:8px; }
.plugin-item { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:14px; background:var(--s1); }
.plugin-item .pi-copy { flex:1; min-width:0; }
.plugin-item b { display:block; font-size:14px; font-weight:600; }
.plugin-item small { display:block; color:var(--red2); font-size:12px; line-height:1.35; margin-top:2px; }
.plugin-item input { width:19px; height:19px; accent-color:var(--red); flex:none; }
.plugin-tools { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px; }
.plugin-tools button { min-height:42px; padding:9px 11px; border:1px solid var(--line); border-radius:12px; text-align:left; font-size:13px; color:var(--red); background:var(--s1); }
.plugin-tools button:active { background:var(--s2); }
.plugin-note { color:var(--red2); font-size:12px; line-height:1.45; margin:9px 0 0; }

/* меню слева */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--overlay); opacity: 0; transition: opacity .22s; }
.scrim.on { opacity: 1; }
.drawer { position: fixed; z-index: 31; top: 0; bottom: 0; left: 0; width: min(330px, 86vw); display: flex; flex-direction: column; background: var(--bg); border-right: 1px solid var(--line); transform: translateX(-102%); transition: transform .24s ease; padding-top: env(safe-area-inset-top); }
.drawer.on { transform: none; }
.dtop { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.dtop img { height: 30px; width: auto; }
.dtop b { font-size: 20px; font-weight: 700; }
.dnew { margin: 4px 16px 10px; height: 46px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-weight: 600; color: var(--red); }
.dnew:hover { background: var(--s1); }
.dlbl { padding: 10px 20px 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--red2); }
.dlist { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.ditem { display: flex; align-items: center; gap: 4px; border-radius: 12px; }
.ditem:hover, .ditem.cur { background: var(--s1); }
.ditem .t { flex: 1; min-width: 0; text-align: left; padding: 11px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.ditem .x { flex: none; width: 36px; height: 36px; margin-right: 4px; border-radius: 10px; display: grid; place-items: center; color: var(--red2); opacity: .75; }
.ditem .x:hover { opacity: 1; background: var(--s2); }
.dnone { padding: 14px 14px; font-size: 14px; color: var(--red2); }
.dacc { flex: none; display: flex; align-items: center; gap: 12px; margin: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); text-align: left; border-radius: 14px; }
.dacc:hover { background: var(--s1); }
.av { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: var(--onred); font-weight: 700; }
.dacc .n { display: block; font-weight: 600; line-height: 1.25; }
.dacc small { color: var(--red2); font-size: 12.5px; }

/* окна */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); animation: up .22s ease; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.shead { flex: none; position: relative; display: flex; align-items: center; justify-content: center; height: 58px; font-weight: 700; font-size: 19px; }
.shead .ib { position: absolute; left: 10px; top: 7px; }
.sbody { flex: 1; overflow-y: auto; padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); }
.swrap { width: min(560px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.mcard { text-align: left; padding: 16px 18px; border-radius: 22px; background: var(--s1); border: 1px solid transparent; display: block; width: 100%; }
.mcard:hover { border-color: var(--line); }
.mcard.sel { border-color: var(--line); background: var(--s2); }
.mcard.lock { opacity: .62; }
.mtop { display: flex; align-items: center; gap: 10px; }
.mtop b { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.badge { padding: 3px 11px; border-radius: 999px; font-size: 14px; background: var(--blueS); color: var(--blue); font-weight: 500; }
.mtop .ck { margin-left: auto; color: var(--blue); }
.mtop .lk { margin-left: auto; color: var(--red2); }
.mcard p { margin: 6px 0 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
.mcard small { display: block; margin-top: 6px; color: var(--red2); font-size: 12.5px; }

.arow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.arow:last-child { border-bottom: 0; }
.arow > span:first-child { color: var(--red2); font-size: 14px; }
.bar { height: 8px; border-radius: 8px; background: var(--s2); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--red); border-radius: 8px; transition: width .4s; }
.pr { display: flex; gap: 8px; }
.pr input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--s1); color: var(--red); outline: none; text-transform: uppercase; font-size: 15px; }
.pr input:focus { border-color: var(--red); }
.pr .btn { height: 46px; padding: 0 18px; }
.sect { margin: 18px 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--red2); }

.toast { position: fixed; z-index: 90; width: max-content; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translate(-50%, 10px); max-width: min(92vw, 420px); padding: 11px 18px; border-radius: 999px; background: var(--btn); color: var(--btnInk); font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

      if ((m = /^(#{1,6})\s+(.*)$/.exec(ln))) { flush(); var h = el('h' + Math.min(Math.max(m[1].length + 1, 2), 4)); inline(h, m[2]); root.append(h); i++; continue; }
      if (/^\s*([-*_])\1{2,}\s*$/.test(ln)) { flush(); root.append(el('hr')); i++; continue; }
      if (/^\s*\|/.test(ln) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        flush();
        var wrap = el('div', 'tbl'), tb = el('table'), th = el('tr');
        cells(ln).forEach(function (c) { var x = el('th'); inline(x, c); th.append(x); });
        var thead = el('thead'); thead.append(th); tb.append(thead);
        var tbody = el('tbody'); i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) { var tr = el('tr'); cells(lines[i]).forEach(function (c) { var x = el('td'); inline(x, c); tr.append(x); }); tbody.append(tr); i++; }
        tb.append(tbody); wrap.append(tb); root.append(wrap); continue;
      }
      if ((m = /^\s*([-*+]|\d+[.)])\s+(.*)$/.exec(ln))) {
        flush();
        var ordered = /\d/.test(m[1]), list = el(ordered ? 'ol' : 'ul');
        while (i < lines.length && (m = /^\s*([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i])) && /\d/.test(m[1]) === ordered) { var li = el('li'); inline(li, m[2]); list.append(li); i++; }
        root.append(list); continue;
      }
      if (/^>\s?/.test(ln)) {
        flush(); var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
        var bq = el('blockquote'); inline(bq, q.join('\n')); root.append(bq); continue;
      }
      if (!ln.trim()) { flush(); i++; continue; }
      para.push(ln); i++;
    }
    flush();
  }

      if (e.key === 'ArrowUp') { e.preventDefault(); cSel = (cSel - 1 + cItems.length) % cItems.length; markSel(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickCmd(cItems[cSel].k); return; }
      if (e.key === 'Escape') { e.preventDefault(); hideMenu(); return; }
    }
    if (e.key === 'Backspace' && cmd && !inp.value) { e.preventDefault(); setCmd(null); return; }
    if (e.key === 'Enter' && !e.shiftKey && !(window.matchMedia && matchMedia('(pointer: coarse)').matches)) { e.preventDefault(); $('composer').requestSubmit(); }
  });
  $('composer').addEventListener('submit', function (e) {
    e.preventDefault();
    if (abort) { abort.abort(); stopSpeak(); return; }
    send();
  });

  function streamChat(key, messages, onText, signal) {
    return fetch(API + '/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ model: key, messages: messages }), signal: signal }).then(function (r) {
      if (!r.ok) {
        return r.json().catch(function () { return null; }).then(function (j) {
          if (r.status === 401) { dropSession(); throw { auth: true, message: 'Сессия закончилась. Войди снова.' }; }
          throw { status: r.status, data: j, message: (j && j.error) || ('Ошибка ' + r.status) };
        });
      }
      var final = null;
      function line(l) {
        if (l.indexOf('data:') !== 0) return;
        var o; try { o = JSON.parse(l.slice(5)); } catch (e) { return; }
        if (o.t) onText(o.t); else if (o.err) throw { message: o.err, stream: true }; else if (o.done) final = o;
      }
      if (r.body && r.body.getReader) {
        var rd = r.body.getReader(), dec = new TextDecoder(), buf = '';
        return (function pump() {
          return rd.read().then(function (x) {
            if (x.done) { buf += dec.decode(); if (buf) line(buf); return final; }
            buf += dec.decode(x.value, { stream: true });
            var i; while ((i = buf.indexOf('\n')) >= 0) { line(buf.slice(0, i).replace(/\r$/, '')); buf = buf.slice(i + 1); }
            return pump();
          });
        })();
      }
      return r.text().then(function (t) { t.split('\n').forEach(line); return final; });
    }, function (e) {
      if (e && e.name === 'AbortError') throw e;
      throw { net: true, message: 'Нет связи с сервером. Проверь интернет.' };
    });
  }

  function notice(text) { var n = el('div', 'sys', text); list.append(n); stick(true); }

  function send() {
    var text = inp.value.trim();
    if (!text || abort) return;
    stopSpeak(); hideMenu();
    var usedCmd = cmd;
    var m = MODELS[model];
    if (!allowed(model)) { toast('Эта модель доступна с подпиской ' + m.badge); return; }
    if (ME.resetAt && ME.resetAt > Date.now() && ME.used + m.cost > ME.budget) {
      notice('Токены закончились. Они вернутся через ' + left(ME.resetAt - Date.now()) + ' (в ' + clock(ME.resetAt) + ').'); return;
    }
    var first = !cur.messages.length;
    if (first) list.textContent = '';
    inp.value = ''; hintOff = false; setCmd(null);
    var stored = usedCmd ? '/' + usedCmd + ' ' + text : text;
    cur.messages.push({ role: 'user', content: stored });
    if (first) cur.title = text.replace(/\s+/g, ' ').slice(0, 40);
    addUser(stored);
    var bot = addBot(''); bot.classList.add('typing');
    pinned = true; stick(true);
    abort = new AbortController(); setBusy(true);
    var acc = '', raf = 0;
    function paint() { raf = 0; var t = stripThink(acc); bot._text = t; md(bot.body, t); stick(); }
    function undo(msgText) { cur.messages.pop(); inp.value = msgText; setCmd(usedCmd); autosize(); }
    streamChat(model, forModel(cur.messages.slice(-30)), function (t) { acc += t; if (!raf) raf = requestAnimationFrame(paint); }, abort.signal).then(function (fin) {
      if (raf) cancelAnimationFrame(raf);
      var t = stripThink(acc);
      if (!t) { bot.remove(); undo(text); notice('Модель не вернула текст. Попробуй ещё раз.'); refreshMe(); return; }
      bot._text = t; md(bot.body, t); bot.acts.hidden = false;
      cur.messages.push({ role: 'assistant', content: t });
      if (fin) { ME.used = fin.used; ME.resetAt = fin.resetAt; renderTok(); }
      saveChat();
      if (TTS.on) speak(t);
    }).catch(function (e) {
      if (raf) cancelAnimationFrame(raf);
      var t = stripThink(acc);
      if (e && e.name === 'AbortError') {
        if (t) { bot._text = t; md(bot.body, t); bot.acts.hidden = false; cur.messages.push({ role: 'assistant', content: t }); saveChat(); }
        else { bot.remove(); undo(text); }
        refreshMe(); return;
      }
      if (e && e.auth) return;
      if (t && e && e.stream) {
        bot._text = t; md(bot.body, t); bot.acts.hidden = false; cur.messages.push({ role: 'assistant', content: t }); saveChat();
        notice(e.message); refreshMe(); return;
      }
      bot.remove(); undo(text);
      if (e && e.status === 429 && e.data && e.data.error === 'limit') {
        ME.used = e.data.used; ME.resetAt = e.data.resetAt; renderTok();
        notice('Токены закончились. Они вернутся через ' + left(e.data.resetAt - Date.now()) + ' (в ' + clock(e.data.resetAt) + ').');
      } else if (e && e.status === 403 && e.data && e.data.error === 'tier') {
        notice('Эта модель доступна с подпиской ' + TIER_NAME[e.data.need] + '.'); refreshMe();
      } else if (e && (e.status === 502 || e.status === 429)) { notice('Модель сейчас не ответила, токены вернулись. Попробуй ещё раз. (' + e.message + ')'); refreshMe();
      } else { notice((e && e.message) || 'Что-то пошло не так.'); refreshMe(); }
    }).then(function () {
      abort = null; setBusy(false); updateHint(); bot.classList.remove('typing'); if (!cur.messages.length && !list.querySelector('.empty')) list.prepend(emptyState());
    });
  }

  /* ---------- старт ---------- */
  setBusy(false); setMode('in');
  if (!API) { show('auth'); $('aerr').textContent = 'Сервер не настроен: впиши адрес Worker в config.js.'; }
  else if (!token) show('auth');
  else {
    api('/api/me').then(function (j) { ME = j.me; enterApp(); }).catch(function (e) {
      if (e && e.auth) return;
      show('auth'); $('aerr').textContent = (e && e.message) || '';
    });
  }
})();
</script>
</body>
</html>
