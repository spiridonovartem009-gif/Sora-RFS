name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          P=$(find . -name package.json -not -path "*/node_modules/*" | head -1)
          echo "Found: $P"
          test -n "$P"
          echo "APP=$(dirname $P)" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
        working-directory: ${{ env.APP }}
      - run: npx cap add android
        working-directory: ${{ env.APP }}
      - run: npx cap sync android
        working-directory: ${{ env.APP }}
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ${{ env.APP }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: sora-rfs-apk
          path: ${{ env.APP }}/android/app/build/outputs/apk/debug/app-debug.apk
          
